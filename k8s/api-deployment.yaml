apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ns-team-ads-test
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: docker-ads-release-auth
      containers:
        - name: api
          image: docker-ads-release.dr-uw2.adobeitc.com/ai-capability-dashboard-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: ai-capability-dashboard-config
            - secretRef:
                name: ai-capability-dashboard-secret
          # In Kubernetes the API must not serve static files; the web pod does.
          # SERVE_STATIC is set to "false" in the ConfigMap.
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
