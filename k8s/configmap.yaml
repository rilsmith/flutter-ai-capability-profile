apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-capability-dashboard-config
  namespace: ns-team-ads-test
  labels:
    app: ai-capability-dashboard
data:
  # Replace these placeholder values with the actual non-sensitive configuration
  # before applying the manifests. Do not commit real values to source control.
  LDAP_URL: "YOUR_LDAP_URL_HERE"
  LDAP_BASE_DN: "YOUR_LDAP_BASE_DN_HERE"
  # Must match the HTTPS origin of the Contour HTTPProxy fqdn.
  CORS_ORIGIN: "https://ai-capability-dashboard.ns-team-ads-test.corp.adobe.com"
  # In Kubernetes the API serves only API/OAuth routes; disable static serving.
  SERVE_STATIC: "false"
  WEB_DIR: "/app/build/web"
  # Local-dev/test escape hatch: accept an unverified primary email for the
  # GitHub test token used in agent-browser end-to-end validation.
  ALLOW_UNVERIFIED_TEST_EMAIL: "true"
