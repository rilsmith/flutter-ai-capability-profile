apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ns-team-ads-test
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: capability_dashboard
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-capability-dashboard-secret
                  key: POSTGRES_PASSWORD
            # Use a subdirectory for the data directory so Postgres does not
            # try to initialize the PVC mount point directly (which may contain
            # a lost+found directory and cause initdb to fail).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
