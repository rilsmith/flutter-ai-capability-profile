apiVersion: v1
kind: Secret
metadata:
  name: ai-capability-dashboard-secret
  namespace: ns-team-ads-test
  labels:
    app: ai-capability-dashboard
# This Secret is committed with placeholder values only.
# Populate it with real values before deploying; never commit real secrets.
# Use a command like:
#   kubectl create secret generic ai-capability-dashboard-secret \
#     --from-literal=GITHUB_CLIENT_ID=... \
#     --from-literal=GITHUB_CLIENT_SECRET=... \
#     --from-literal=REDIRECT_URI=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     -n ns-team-ads-test --dry-run=client -o yaml > k8s/secret.yaml
type: Opaque
stringData:
  GITHUB_CLIENT_ID: REPLACE_WITH_GITHUB_CLIENT_ID
  GITHUB_CLIENT_SECRET: REPLACE_WITH_GITHUB_CLIENT_SECRET
  # Must match the HTTPS origin of the Contour HTTPProxy fqdn.
  REDIRECT_URI: https://ai-capability-dashboard.corp.ethos270-stage-va7.ethos.adobe.net/auth
  DATABASE_URL: REPLACE_WITH_DATABASE_URL
  POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD
