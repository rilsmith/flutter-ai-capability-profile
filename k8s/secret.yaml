apiVersion: v1
kind: Secret
metadata:
  name: ai-capability-dashboard-secret
  namespace: ns-team-ads-test
  labels:
    app: ai-capability-dashboard
# This Secret is committed with placeholder values only.
# Populate it with real values before deploying; never commit real secrets.
# Use a command like:
#   kubectl create secret generic ai-capability-dashboard-secret \
#     --from-literal=GITHUB_CLIENT_ID=YOUR_GITHUB_CLIENT_ID \
#     --from-literal=GITHUB_CLIENT_SECRET=YOUR_GITHUB_CLIENT_SECRET \
#     --from-literal=REDIRECT_URI=https://ai-capability-dashboard.corp.ethos270-stage-va7.ethos.adobe.net/auth \
#     --from-literal=DATABASE_URL=YOUR_DATABASE_URL \
#     --from-literal=POSTGRES_PASSWORD=********************** \
#     --from-literal=LDAP_BIND_DN=YOUR_LDAP_BIND_DN \
#     --from-literal=LDAP_PASSWORD=YOUR_LDAP_PASSWORD \
#     -n ns-team-ads-test --dry-run=client -o yaml > k8s/secret.yaml
type: Opaque
stringData:
  GITHUB_CLIENT_ID: YOUR_GITHUB_CLIENT_ID
  GITHUB_CLIENT_SECRET: YOUR_GITHUB_CLIENT_SECRET
  # Must match the GitHub OAuth callback URL registered for the app.
  # For the Contour HTTPProxy fqdn this is:
  #   https://ai-capability-dashboard.corp.ethos270-stage-va7.ethos.adobe.net/auth
  REDIRECT_URI: "https://ai-capability-dashboard.corp.ethos270-stage-va7.ethos.adobe.net/auth"
  DATABASE_URL: YOUR_DATABASE_URL
  POSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD
  # Bind credentials for LDAP lookups. The directory ACLs hide the "manager"
  # attribute from anonymous readers (changed in the 2026-08 SailPoint sync),
  # so the team endpoints require an authenticated bind. Use a service
  # account, not a personal credential.
  LDAP_BIND_DN: YOUR_LDAP_BIND_DN
  LDAP_PASSWORD: YOUR_LDAP_PASSWORD
