apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: ai-capability-dashboard
  namespace: ns-team-ads-test
  labels:
    app: ai-capability-dashboard
spec:
  virtualhost:
    # Replace with the actual ingress hostname for this deployment.
    fqdn: REPLACE_WITH_INGRESS_HOST
    # Replace with the name of the TLS secret provisioned by the cluster.
    tls:
      secretName: REPLACE_WITH_TLS_SECRET
  routes:
    # All API traffic goes to the API service.
    - conditions:
        - prefix: /api
      services:
        - name: api
          port: 5000
    # OAuth callback goes to the API service.
    - conditions:
        - prefix: /auth
      services:
        - name: api
          port: 5000
    # Everything else is served by the web (Nginx) service.
    # Because this route is listed last, it acts as the catch-all fallback.
    - conditions:
        - prefix: /
      services:
        - name: web
          port: 80
