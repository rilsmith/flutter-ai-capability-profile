apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: ai-capability-dashboard
  namespace: ns-team-ads-test
  annotations:
    kubernetes.io/ingress.class: contour-corp
  labels:
    app: ai-capability-dashboard
spec:
  virtualhost:
    fqdn: ai-capability-dashboard.corp.ethos270-stage-va7.ethos.adobe.net
    tls:
      secretName: heptio-contour/cluster-ssl-corp
  routes:
    # All API traffic goes to the API service.
    - conditions:
        - prefix: /api
      services:
        - name: api
          port: 5000
    # OAuth callback goes to the API service.
    - conditions:
        - prefix: /auth
      services:
        - name: api
          port: 5000
    # Health and readiness probes are served by the API.
    - conditions:
        - prefix: /health
      services:
        - name: api
          port: 5000
    - conditions:
        - prefix: /ready
      services:
        - name: api
          port: 5000
    # Everything else is served by the web (Nginx) service.
    # Because this route is listed last, it acts as the catch-all fallback.
    - conditions:
        - prefix: /
      services:
        - name: web
          port: 80
